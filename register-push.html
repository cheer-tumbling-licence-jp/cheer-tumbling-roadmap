<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知設定｜チアタンブリング</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg:#0f0a1f; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
          --text:#fff; --dim:#a9a5c0; --pink:#ff4d8f; --cyan:#06d6f8; --purple:#a855f7;
          --green:#4ade80; --orange:#ff8a3d; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0f0a1f,#1a0f3d);
       color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
       padding:20px 16px 60px;-webkit-font-smoothing:antialiased;max-width:560px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .top a{color:var(--dim);text-decoration:none;font-size:12px;border:1px solid var(--border);
         padding:6px 10px;border-radius:8px}
  h1{font-size:19px;font-weight:900;margin:0 0 4px;
     background:linear-gradient(135deg,var(--pink),var(--purple),var(--cyan));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:12px;color:var(--dim);margin-bottom:18px;line-height:1.7}

  /* 今どういう状態かを、必ず日本語の文章で出す */
  .status{border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}
  .status.on{background:linear-gradient(135deg,rgba(74,222,128,.15),rgba(6,214,248,.12));
             border:1px solid rgba(74,222,128,.45)}
  .status.off{background:var(--card);border:1px solid var(--border)}
  .status.warn{background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.5)}
  .status .ico{font-size:40px;line-height:1;margin-bottom:8px}
  .status .ttl{font-size:16px;font-weight:900;margin-bottom:6px}
  .status .dsc{font-size:13px;color:var(--dim);line-height:1.8;white-space:pre-wrap;text-align:left}

  button{width:100%;border:none;border-radius:14px;padding:16px;font-size:15px;
         font-weight:900;font-family:inherit;cursor:pointer;color:#fff;
         background:linear-gradient(135deg,var(--pink),var(--purple));margin-bottom:10px}
  button.sec{background:var(--card);border:1px solid var(--border)}
  button.quiet{background:transparent;border:1px solid var(--border);color:var(--dim);
               font-size:13px;padding:12px}
  button[disabled]{opacity:.5}

  /* 止まっている理由と、次にやることを必ず書く */
  .blocker{background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.5);
           border-radius:14px;padding:16px;font-size:13px;line-height:1.9;margin-bottom:14px}
  .blocker b{color:var(--orange)}
  .blocker ol{margin:10px 0 0;padding-left:20px}
  .blocker li{margin-bottom:6px}

  details{margin-top:18px}
  summary{font-size:12px;color:var(--dim);cursor:pointer;padding:8px 0}
  #log{background:#000;border-radius:12px;padding:12px;font-size:11px;
       font-family:ui-monospace,monospace;line-height:1.7;white-space:pre-wrap;
       word-break:break-all;max-height:320px;overflow-y:auto;color:#9fe;margin-top:8px}
  .env{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;
       border-bottom:1px solid rgba(255,255,255,.06)}
  .env:last-child{border:none}
  .env .k{color:var(--dim)} .ok{color:var(--green);font-weight:800} .ng{color:var(--pink);font-weight:800}
</style>
</head>
<body>

<div class="top"><a href="/">← アプリに戻る</a></div>

<h1>🔔 通知設定</h1>
<div class="sub">選手が課題を提出したとき、アプリを閉じていてもお知らせが届きます。</div>

<!-- どのアカウントに通知が届くのか。ここを間違えると何をしても届かない。
     実際に、別アカウントでログインしたまま設定し続けた事例が起きたため常時表示する -->
<div id="whoBox" style="background:rgba(6,214,248,.10);border:1px solid rgba(6,214,248,.4);
     border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.7;">
  <span style="color:var(--dim);">通知の届け先：</span>
  <b id="whoEmail" style="color:var(--cyan);">確認中…</b>
</div>

<!-- 今の状態（常に文章で説明する） -->
<div class="status off" id="statusBox">
  <div class="ico" id="statusIco">⏳</div>
  <div class="ttl" id="statusTtl">確認中…</div>
  <div class="dsc" id="statusDsc">　</div>
</div>

<!-- 止まっている理由。無ければ非表示 -->
<div class="blocker" id="blocker" style="display:none;"></div>

<!-- 主ボタンは絶対に無効化しない。押せば必ず何か言う -->
<button id="btnOn">通知をオンにする</button>
<button id="btnTest" class="sec">テスト通知を送る</button>
<button id="btnReset" class="quiet">うまくいかないので最初からやり直す</button>
<button id="btnReport" class="quiet">🆘 うまくいかない状況を運営に送る</button>

<details>
  <summary>詳しい情報を見る</summary>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px;">
    <div class="env"><span class="k">ログイン</span><span id="e0">-</span></div>
    <div class="env"><span class="k">開いているURL</span><span id="e7">-</span></div>
    <div class="env"><span class="k">端末</span><span id="e1">-</span></div>
    <div class="env"><span class="k">ホーム画面から起動</span><span id="e2">-</span></div>
    <div class="env"><span class="k">通知の許可</span><span id="e3">-</span></div>
    <div class="env"><span class="k">Push対応</span><span id="e4">-</span></div>
    <div class="env"><span class="k">アイコンバッジ</span><span id="e5">-</span></div>
    <div class="env"><span class="k">サーバー登録</span><span id="e6">-</span></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:10px;">
    <button id="btnBadge" class="sec" style="margin:0;font-size:12px;padding:10px;">数字「5」を出す</button>
    <button id="btnBadgeClear" class="sec" style="margin:0;font-size:12px;padding:10px;">数字を消す</button>
  </div>
  <div id="log">起動中…</div>
</details>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script>
// サーバー側 functions/index.js の VAPID_PUBLIC_KEY と必ず一致させること
const VAPID_PUBLIC_KEY = 'BF1KQaAd9sKkdVW2JxiGyHZJsyYlbAr4kxH0jpwYgsZEgeRN0XDCKWljgxx1XL5MMXogS5QLO5EetuxKKAsNZdA';

const logEl = document.getElementById('log');
const lines = [];
function log(m){
  lines.push('[' + new Date().toLocaleTimeString('ja-JP') + '] ' + m);
  logEl.textContent = lines.join('\n');
  logEl.scrollTop = logEl.scrollHeight;
  console.log('[push]', m);
}

firebase.initializeApp({
  apiKey: "AIzaSyApucHjGGTbd5aAJFaKw_kwvCsm2EyRiSE",
  authDomain: "cheer-tumbling-roadmap.firebaseapp.com",
  projectId: "cheer-tumbling-roadmap",
  storageBucket: "cheer-tumbling-roadmap.firebasestorage.app",
  messagingSenderId: "1012752519800",
  appId: "1:1012752519800:web:a393d04fced850edac938d"
});
const auth = firebase.auth();

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isPWA = window.matchMedia('(display-mode: standalone)').matches ||
              window.navigator.standalone === true;
const hasPush  = 'serviceWorker' in navigator && 'PushManager' in window;
const hasNotif = 'Notification' in window;

let currentUser = null;
let serverCount = null;   // このアカウントにサーバー上で登録されている端末数
let thisDeviceOk = false; // この端末がこのアカウントで登録済みか

function env(id, ok, txt){ const e=document.getElementById(id); e.textContent=txt; e.className = ok?'ok':'ng'; }
function setStatus(kind, ico, ttl, dsc){
  document.getElementById('statusBox').className = 'status ' + kind;
  document.getElementById('statusIco').textContent = ico;
  document.getElementById('statusTtl').textContent = ttl;
  document.getElementById('statusDsc').textContent = dsc;
}
function setBlocker(html){
  const b = document.getElementById('blocker');
  if (!html) { b.style.display = 'none'; b.innerHTML = ''; return; }
  b.innerHTML = html; b.style.display = '';
}

const HOME_STEPS =
  '<b>⚠️ iPhone では、先にホーム画面への追加が必要です</b>' +
  '<div style="margin-top:6px;color:var(--text);">Apple の仕様で、Safari のままでは通知を登録できません。</div>' +
  '<ol>' +
  '<li>画面下の <b>共有ボタン（□に↑）</b> をタップ</li>' +
  '<li><b>「ホーム画面に追加」</b> をタップ</li>' +
  '<li>ホーム画面にできた <b>アイコンからアプリを開く</b></li>' +
  '<li>メニュー → <b>🔔 通知の設定・テスト</b> をもう一度開く</li>' +
  '</ol>';

const REBUILD_STEPS =
  '<b>🔁 ホーム画面のアイコンを作り直してください</b>' +
  '<div style="margin-top:6px;color:var(--text);">' +
  'iPhone では、一度「許可しない」を選ぶと設定アプリに項目が出ず、' +
  '許可し直す方法がありません。アイコンを作り直すと元に戻ります。</div>' +
  '<ol>' +
  '<li>ホーム画面の <b>Tumbling のアイコンを長押し → 削除</b>' +
  '<div style="color:var(--dim);font-size:12px;">（アプリのデータは消えません。ログイン情報もそのままです）</div></li>' +
  '<li><b>Safari</b> で <b>roadmap.cheer-tumbling.jp</b> を開く</li>' +
  '<li>画面下の <b>共有ボタン（□に↑）→「ホーム画面に追加」</b></li>' +
  '<li>できた <b>アイコンからアプリを開き</b>、ログインする</li>' +
  '<li>メニュー → <b>🔔 通知の設定・テスト</b> →「通知をオンにする」</li>' +
  '<li>「<b>許可</b>」を選ぶ（ここで断ると、また同じ状態になります）</li>' +
  '</ol>';

// このアイコンが今のURLのものか。
// 2026-05-26 に独自ドメインへ移行しており、それ以前に追加した
// アイコンは旧URL（github.io）を指す。旧URLでは /service-worker.js が
// 404 になるため、通知は原理的に動かない。
const CURRENT_ORIGIN = 'https://roadmap.cheer-tumbling.jp';
const isOldIcon = location.origin !== CURRENT_ORIGIN && location.hostname !== 'localhost';

const OLD_ICON_STEPS =
  '<b>⚠️ このアイコンは古いURLのものです</b>' +
  '<div style="margin-top:6px;color:var(--text);">' +
  '今開いているのは <b>' + location.origin + '</b> です。' +
  'アプリの正しいURLは <b>' + CURRENT_ORIGIN + '</b> で、' +
  '古いURLのままだと通知のしくみが動きません。</div>' +
  '<ol>' +
  '<li>ホーム画面の <b>古いアイコンを長押し → 削除</b></li>' +
  '<li><b>Safari</b> で <b>roadmap.cheer-tumbling.jp</b> を開く</li>' +
  '<li><b>共有ボタン（□に↑）→「ホーム画面に追加」</b></li>' +
  '<li>できたアイコンから開いて、ログインし直す</li>' +
  '</ol>';

const timeout = (p, ms, label) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + 'が' + ms + 'ms応答なし')), ms))
]);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function getLocalSubscription(){
  if (!hasPush) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? await reg.pushManager.getSubscription() : null;
}

// 端末側だけでなくサーバー側も見る。
// 「購読はあるが、別アカウントに紐づいている」状態を"オン"と誤表示しないため。
async function refresh(){
  env('e0', !!currentUser, currentUser ? (currentUser.email || 'ログイン中') : '未ログイン');
  document.getElementById('whoEmail').textContent =
    currentUser ? (currentUser.email || currentUser.uid) : '未ログイン（先にログインしてください）';
  env('e7', !isOldIcon, location.origin);
  env('e1', true, isIOS ? 'iPhone / iPad' : 'PC / Android');
  env('e2', isPWA, isPWA ? 'はい' : 'いいえ');
  env('e3', hasNotif && Notification.permission === 'granted', hasNotif ? Notification.permission : '非対応');
  env('e4', hasPush, hasPush ? '対応' : '非対応');
  env('e5', !!navigator.setAppBadge, navigator.setAppBadge ? '対応' : '非対応');

  const sub = await getLocalSubscription().catch(() => null);

  if (currentUser) {
    try {
      const fn = firebase.app().functions('asia-northeast1').httpsCallable('pushStatusForMe');
      const r = await timeout(fn({ endpoint: sub ? sub.endpoint : '' }), 15000, 'サーバー確認');
      serverCount  = r.data['登録数'];
      thisDeviceOk = r.data['この端末が登録済み'] === true;
      env('e6', thisDeviceOk, thisDeviceOk ? 'この端末を登録済み' : (serverCount + '台（この端末は未登録）'));
    } catch (e) {
      env('e6', false, '確認できず');
      log('サーバー確認に失敗: ' + e.message);
    }
  } else {
    env('e6', false, '-');
  }

  // ここから表示の決定。必ず「今どうなっているか」と「次に何をするか」を書く。
  setBlocker('');

  if (isOldIcon) {
    setStatus('warn', '🔁', 'アイコンを作り直してください',
      '今開いているURLが古いものです（' + location.origin + '）。\n'
      + 'このままでは通知のしくみが動きません。下の手順でアイコンを作り直してください。');
    setBlocker(OLD_ICON_STEPS);
    return;
  }
  if (!hasPush) {
    setStatus('warn', '🚫', 'この端末では通知を使えません',
      'お使いのブラウザが通知（Push）に対応していません。\niPhone なら Safari、Android なら Chrome をお使いください。');
    return;
  }
  if (!currentUser) {
    setStatus('off', '🔒', 'ログインが必要です',
      'どのアカウントに通知を届けるかを決めるため、先にログインしてください。\n上の「← アプリに戻る」からログインできます。');
    return;
  }
  if (isIOS && !isPWA) {
    setStatus('warn', '📲', 'ホーム画面への追加が必要です',
      'iPhone / iPad では、Safari のままだと通知を登録できません。\n下の手順でホーム画面に追加してから、アイコンで開き直してください。');
    setBlocker(HOME_STEPS);
    return;
  }
  if (thisDeviceOk && Notification.permission === 'granted') {
    setStatus('on', '🔔', '通知はオンです',
      (currentUser.email || 'このアカウント') + ' 宛てに届きます。\n'
      + '課題の提出があると、アプリを閉じていてもアイコンに件数が出ます。');
    return;
  }
  if (sub && !thisDeviceOk) {
    setStatus('warn', '🔁', '別のアカウント宛てになっています',
      'この端末の通知は、以前ログインしていた別のアカウント宛てに登録されています。\n'
      + '「通知をオンにする」を押すと、' + (currentUser.email || '今のアカウント') + ' 宛てに切り替わります。');
    return;
  }
  setStatus('off', '🔕', '通知はオフです',
    '「通知をオンにする」を押すと設定できます。1分もかかりません。');
}

auth.onAuthStateChanged(u => {
  currentUser = u;
  log(u ? ('ログイン中: ' + (u.email || u.uid.slice(0,12))) : '未ログイン');
  refresh();
});

// 端末の状況を運営に送る（手動ボタンからも、失敗時の自動送信からも使う）
//
// これまで、利用者側で何が起きたのかを確認する手段が無く、
// 推測で直しては外していた。設定が通らなかったときは、
// 利用者に何も押させずに自動で状況を送る。
async function sendTrouble(reason) {
  try {
    if (!currentUser) return false;
    const sub = await getLocalSubscription().catch(() => null);
    const fn = firebase.app().functions('asia-northeast1').httpsCallable('reportPushTrouble');
    const r = await timeout(fn({
      device: isIOS ? 'iPhone / iPad' : 'PC / Android',
      isPWA, hasPush, hasBadge: !!navigator.setAppBadge,
      permission: hasNotif ? Notification.permission : '非対応',
      hasSubscription: !!sub,
      serverCount: serverCount,
      log: '【' + reason + '】\n' + lines.join('\n'),
      ua: navigator.userAgent
    }), 20000, '送信');
    return !!(r.data && r.data.ok);
  } catch (e) { log('状況の送信に失敗: ' + (e.message || e)); return false; }
}

// ── 通知をオンにする ──
// このボタンは絶対に disabled にしない。押したら必ず理由を表示する。
document.getElementById('btnOn').onclick = async () => {
  const b = document.getElementById('btnOn');
  b.disabled = true; b.textContent = '設定中…';
  try {
    if (!hasPush) {
      alert('この端末は通知に対応していません。\niPhone なら Safari、Android なら Chrome でお試しください。');
      return;
    }
    if (!currentUser) {
      alert('先にログインしてください。\n「← アプリに戻る」からログインできます。');
      return;
    }
    if (isIOS && !isPWA) {
      setBlocker(HOME_STEPS);
      alert('iPhone では、先にホーム画面に追加する必要があります。\n\n'
          + '① 画面下の共有ボタン（□に↑）\n'
          + '②「ホーム画面に追加」\n'
          + '③ できたアイコンからアプリを開く\n'
          + '④ もう一度この画面を開く\n\n'
          + '画面に手順を表示しました。');
      return;
    }

    // 1) 通知の許可（必ずタップ操作の中で呼ぶ＝iOS の必須条件）
    //
    //    ここで permission が 'denied' でも絶対に止めない。
    //    iOS のホーム画面アプリでは、実際には許可されていても
    //    Notification.permission / requestPermission() が 'denied' を返す
    //    不具合が報告されており（Apple Developer Forums thread/725619）、
    //    それでも pushManager.subscribe() は成功し通知も届く。
    //    許可の表示を信じて止めると、動くはずの端末まで設定できなくなる。
    log('通知の許可（現在: ' + Notification.permission + '）');
    if (Notification.permission !== 'granted') {
      try {
        const res = await timeout(Notification.requestPermission(), 30000, '許可ダイアログ');
        log('許可の応答: ' + res + '（denied でも購読を試します）');
      } catch (e) {
        log('許可の取得でエラー: ' + e.message + '（続行します）');
      }
    }

    // 2) Service Worker（push ハンドラは service-worker.js に統合済み）
    log('Service Worker を登録中…');
    const reg = await timeout(navigator.serviceWorker.register('/service-worker.js'), 20000, 'SW登録');
    await navigator.serviceWorker.ready;
    log('SW OK: ' + reg.scope);

    // 3) 古い SW に紐づいた購読が残っていたら必ず捨てる
    //    （購読は登録した SW に紐づく。SW を差し替えると Apple は受理し続けるのに
    //      受け取る SW が居なくなり、送信成功なのに通知が出ない状態になる）
    const allRegs = await navigator.serviceWorker.getRegistrations();
    for (const r of allRegs) {
      const url = (r.active || r.installing || r.waiting || {}).scriptURL || '';
      if (url && !url.endsWith('/service-worker.js')) {
        const oldSub = await r.pushManager.getSubscription().catch(() => null);
        if (oldSub) { await oldSub.unsubscribe().catch(() => {}); log('古い購読を解除'); }
        await r.unregister().catch(() => {});
        log('古い SW を解除: ' + url.split('/').pop());
      }
    }

    // 4) Push 購読
    log('Push を購読中…');
    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      const cur = sub.options && sub.options.applicationServerKey;
      const want = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
      let same = false;
      if (cur) {
        const a = new Uint8Array(cur);
        same = a.length === want.length && a.every((v, i) => v === want[i]);
      }
      if (!same) { log('VAPID 鍵が変わっているため購読を作り直します'); await sub.unsubscribe().catch(()=>{}); sub = null; }
    }
    if (!sub) {
      sub = await timeout(reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      }), 30000, '購読');
    }
    log('購読OK: ' + sub.endpoint.slice(0, 48) + '…');

    // 5) サーバーに保存（uid はサーバー側で検証済みのものが使われる）
    log('サーバーに登録中…');
    const fn = firebase.app().functions('asia-northeast1').httpsCallable('savePushSubscription');
    const res = await timeout(fn({ subscription: sub.toJSON(), ua: navigator.userAgent, isPWA }),
                              20000, 'サーバー登録');
    if (!res.data || !res.data.ok) throw new Error((res.data && res.data.error) || '保存失敗');

    // 購読が失効して SW が取り直すとき、誰の購読かを送れるよう控える
    try {
      const cache = await caches.open('cta-push-owner');
      await cache.put('owner', new Response(JSON.stringify({
        uid: currentUser.uid, email: currentUser.email || null
      }), { headers: { 'Content-Type': 'application/json' } }));
    } catch (e) {}

    // サーバーに本当に入ったかを必ず確認する。
    // 画面が「完了」と言っても、サーバーに無ければ通知は一生届かない。
    log('サーバー側を確認中…');
    await refresh();
    if (!thisDeviceOk) {
      log('❌ サーバーに登録が見当たりません');
      const sent = await sendTrouble('画面上は完了したがサーバーに登録が無い');
      alert('設定が完了しませんでした。\n\n'
          + '画面上は進みましたが、サーバー側に登録が残っていません。\n'
          + (sent ? '状況を運営に自動送信しました。原因を調べて連絡します。'
                  : 'お手数ですが画面のスクリーンショットをお送りください。'));
      return;
    }
    log('✅ 設定完了');
    alert('通知をオンにしました。\n\n'
        + (currentUser.email || 'このアカウント') + ' 宛てに届きます。\n'
        + '「テスト通知を送る」で確認できます。');
  } catch (e) {
    log('❌ ' + (e.message || e));
    // 利用者に押させず、ここで自動的に状況を送る
    const sent = await sendTrouble('設定中にエラー: ' + (e.message || e));
    log(sent ? '状況を運営に自動送信しました' : '状況の自動送信はできませんでした');
    // iOS は、一度断った web アプリを「設定 → 通知」に載せないことがある。
    // その場合いくら設定画面を探しても項目が無く、許可し直す方法が無い。
    // 唯一の確実な復旧は、ホーム画面のアイコンを消して追加し直すこと。
    if (isIOS) {
      setBlocker(REBUILD_STEPS);
      alert('設定できませんでした。\n\n' + (e.message || e) + '\n\n'
          + (sent ? '状況を運営に自動で送りました。原因を調べて連絡します。\n\n' : '')
          + 'iPhone で一度「許可しない」を選ぶと、設定アプリに項目が出ず、\n'
          + '許可し直せなくなります。\n'
          + 'ホーム画面のアイコンを削除して追加し直すと直ります。\n'
          + '画面に手順を表示しました。');
    } else {
      alert('設定できませんでした。\n\n' + (e.message || e)
          + '\n\n下の「🆘 うまくいかない状況を運営に送る」を押していただければ、原因を調べます。');
    }
  } finally {
    b.disabled = false; b.textContent = '通知をオンにする';
  }
};

// ── テスト送信 ──
document.getElementById('btnTest').onclick = async () => {
  const b = document.getElementById('btnTest');
  b.disabled = true; b.textContent = '送信中…';
  try {
    if (!currentUser) { alert('先にログインしてください。'); return; }
    if (!thisDeviceOk) {
      alert('この端末はまだ登録されていません。\n先に「通知をオンにする」を押してください。');
      return;
    }
    const fn = firebase.app().functions('asia-northeast1').httpsCallable('sendTestPush');
    const resp = await timeout(fn(), 25000, 'サーバー応答');
    const r = resp.data || {};
    log('サーバー応答: ' + JSON.stringify(r));
    if (r.sent > 0) {
      alert('送信しました。\n数秒後に通知が届くか確認してください。\n（アプリを閉じた状態でも届きます）');
    } else {
      alert('送信できませんでした。\n' + (r.error || JSON.stringify(r))
          + '\n\n「🆘 うまくいかない状況を運営に送る」を押してください。');
    }
  } catch (e) {
    log('❌ ' + e.message);
    alert('送信エラー：' + e.message);
  } finally {
    b.disabled = false; b.textContent = 'テスト通知を送る';
  }
};

// ── 最初からやり直す ──
// 購読も Service Worker も全部捨ててから、もう一度作り直す。
// 途中で壊れた状態が残っていると、何度押しても直らないため。
document.getElementById('btnReset').onclick = async () => {
  if (!confirm('通知の設定を一度すべて消して、作り直します。\nよろしいですか？')) return;
  const b = document.getElementById('btnReset');
  b.disabled = true; b.textContent = 'やり直し中…';
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) {
      const s = await r.pushManager.getSubscription().catch(() => null);
      if (s) { await s.unsubscribe().catch(() => {}); log('購読を解除'); }
      await r.unregister().catch(() => {});
      log('SW を解除: ' + ((r.active||{}).scriptURL||'').split('/').pop());
    }
    try { await caches.delete('cta-push-owner'); } catch (e) {}
    log('すべて消しました。もう一度オンにします…');
    await refresh();
    document.getElementById('btnOn').click();
  } catch (e) {
    log('❌ ' + e.message);
    alert('やり直せませんでした：' + (e.message || e));
  } finally {
    b.disabled = false; b.textContent = 'うまくいかないので最初からやり直す';
  }
};

// ── 状況を運営に送る ──
document.getElementById('btnReport').onclick = async () => {
  const b = document.getElementById('btnReport');
  b.disabled = true; b.textContent = '送信中…';
  try {
    if (!currentUser) { alert('先にログインしてください。'); return; }
    const ok = await sendTrouble('利用者が手動で報告');
    alert(ok ? '状況を運営に送りました。確認して対応します。'
             : '送信できませんでした。お手数ですが画面のスクリーンショットをお送りください。');
  } finally {
    b.disabled = false; b.textContent = '🆘 うまくいかない状況を運営に送る';
  }
};

// ── アイコンバッジ単体の確認 ──
document.getElementById('btnBadge').onclick = async () => {
  if (!navigator.setAppBadge) {
    alert('この端末はアイコンバッジに対応していません。\niPhone の場合はホーム画面に追加したアイコンから開いてください。');
    return;
  }
  try {
    await navigator.setAppBadge(5);
    log('setAppBadge(5) 実行');
    alert('アイコンに「5」を設定しました。ホーム画面に戻って確認してください。\n\n'
        + '出ていない場合：設定 → 通知 → Tumbling → バッジ がオンか確認してください。\n'
        + '同じアイコンが複数あると、古い方に数字が付きます。');
  } catch (e) { log('❌ setAppBadge: ' + e.message); alert('エラー: ' + e.message); }
};
document.getElementById('btnBadgeClear').onclick = async () => {
  try {
    if (navigator.clearAppBadge) await navigator.clearAppBadge();
    log('バッジを消去');
    alert('アイコンの数字を消しました。');
  } catch (e) { log('❌ ' + e.message); }
};

log('端末: ' + navigator.userAgent.slice(0, 90));
log('PWA=' + isPWA + ' / Push対応=' + hasPush + ' / 通知許可=' + (hasNotif ? Notification.permission : 'N/A'));
refresh();
</script>
