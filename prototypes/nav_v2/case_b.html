<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASE B：階層化型（メインカード+サブピル）｜ナビ刷新</title>
<link rel="stylesheet" href="_common.css">
<style>
  /* ========== CASE B: 階層化型 ========== */
  /* メインカード（上段） */
  .tabs-b-main {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 22px 0 12px;
  }
  .tab-b.main {
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text);
  }
  .tab-b.main:hover {
    background: var(--card-hover);
    border-color: var(--pink);
    transform: translateY(-2px);
  }
  .tab-b.main.active {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-color: transparent;
    box-shadow: var(--shadow);
  }
  .tab-b.main .icon {
    width: 52px;
    height: 52px;
    background: rgba(255,255,255,0.10);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .tab-b.main.active .icon { background: rgba(255,255,255,0.25); }
  .tab-b.main .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
  }
  .tab-b.main .ja { font-size: 19px; font-weight: 800; }
  .tab-b.main .en { font-size: 11px; opacity: 0.6; letter-spacing: 0.08em; }

  /* サブ：個人ツールラベル＋ピル */
  .tabs-b-sub-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 6px 0 26px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.025);
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  .tabs-b-sub-label {
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .tabs-b-sub {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }
  .tab-b.sub {
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    transition: all .2s;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .tab-b.sub.menu { color: var(--menu); border-color: rgba(192, 132, 252, 0.4); }
  .tab-b.sub.progress { color: var(--progress); border-color: rgba(16, 212, 137, 0.4); }
  .tab-b.sub.program { color: var(--program); border-color: rgba(255, 174, 58, 0.4); }
  .tab-b.sub:hover { transform: translateY(-1px); background: var(--card-hover); }
  .tab-b.sub.menu.active { background: linear-gradient(135deg, var(--menu), #7d3ddf); color: white; border-color: transparent; }
  .tab-b.sub.progress.active { background: linear-gradient(135deg, var(--progress), #0a9763); color: white; border-color: transparent; }
  .tab-b.sub.program.active { background: linear-gradient(135deg, var(--program), #d97c00); color: white; border-color: transparent; }

  @media (max-width: 600px) {
    .tabs-b-main { grid-template-columns: 1fr; gap: 10px; }
    .tab-b.main { padding: 18px 18px; }
    .tabs-b-sub-wrap { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">

<div class="proto-header">
  <span class="proto-badge">CASE B</span>
  <h1 class="proto-title">階層化型（メインカード + サブピル）</h1>
  <p class="proto-subtitle">メイン2つ＝大きな2分割カード／サブ3つ＝色違いピルで「個人ツール」ラベル付き</p>
</div>

<!-- メインタブ：上段大きなカード -->
<div class="tabs-b-main">
  <div class="tab-b main active" data-tab="skills">
    <div class="icon">🤸</div>
    <div class="label">
      <div class="ja">タンブリング技</div>
      <div class="en">SKILLS</div>
    </div>
  </div>
  <div class="tab-b main" data-tab="trainings">
    <div class="icon">💪</div>
    <div class="label">
      <div class="ja">トレーニング一覧</div>
      <div class="en">TRAININGS</div>
    </div>
  </div>
</div>

<!-- サブタブ：個人ツール -->
<div class="tabs-b-sub-wrap">
  <div class="tabs-b-sub-label">🎯 個人ツール</div>
  <div class="tabs-b-sub">
    <div class="tab-b sub menu" data-tab="menu"><span>📋</span><span>練習メニュー</span></div>
    <div class="tab-b sub progress" data-tab="progress"><span>📈</span><span>成長記録</span></div>
    <div class="tab-b sub program" data-tab="program"><span>⚙️</span><span>練習プログラム</span></div>
  </div>
</div>

<div class="dummy">
  <strong style="color: var(--text);">この下に既存のメインコンテンツが続きます。</strong><br><br>
  カードとピルをクリックして配色とアクティブ表示を確認できます。
</div>

<div style="text-align: center; margin-top: 30px;">
  <a class="case-link" href="index.html">← 全案一覧</a>
  <a class="case-link" href="case_a.html">← 案A</a>
  <a class="case-link" href="case_c.html">案C →</a>
</div>

</div>
<script>
  document.querySelectorAll('.tab-b.main').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab-b.main').forEach(o => o.classList.remove('active'));
      t.classList.add('active');
    });
  });
  document.querySelectorAll('.tab-b.sub').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab-b.sub').forEach(o => o.classList.remove('active'));
      t.classList.add('active');
    });
  });
</script>
</body>
</html>
