<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【試作】オープニング画面｜チアタンブリングロードマップ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== ステージ1：フラッシュバック動画スライドショー ========== */
  .opening-stage {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  .opening-stage.done {
    animation: fadeOutStage 0.6s forwards;
    pointer-events: none;
  }
  @keyframes fadeOutStage {
    to { opacity: 0; visibility: hidden; }
  }

  .flashback {
    position: absolute;
    inset: 0;
  }
  .flashback-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: flashCycle 6s infinite;
    filter: brightness(0.7) contrast(1.05);
  }
  /* 各スライドの遅延を付けて連続再生（6枚 × 1秒間隔） */
  .flashback-slide:nth-child(1) { animation-delay: 0s; }
  .flashback-slide:nth-child(2) { animation-delay: 1s; }
  .flashback-slide:nth-child(3) { animation-delay: 2s; }
  .flashback-slide:nth-child(4) { animation-delay: 3s; }
  .flashback-slide:nth-child(5) { animation-delay: 4s; }
  .flashback-slide:nth-child(6) { animation-delay: 5s; }

  @keyframes flashCycle {
    0%   { opacity: 0; transform: scale(1.15); }
    3%   { opacity: 1; }
    12%  { opacity: 1; }
    16%  { opacity: 0; transform: scale(1.30); }
    100% { opacity: 0; transform: scale(1.30); }
  }

  /* 白フラッシュ演出（0.9秒ごと） */
  .flash-white {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation: whiteFlash 0.9s infinite;
    pointer-events: none;
    mix-blend-mode: overlay;
  }
  @keyframes whiteFlash {
    0%, 92%, 100% { opacity: 0; }
    96% { opacity: 0.45; }
  }

  /* 上下グラデーションで文字が読みやすいように */
  .flashback::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(15, 10, 31, 0.55) 0%,
      transparent 25%,
      transparent 60%,
      rgba(15, 10, 31, 0.75) 90%,
      rgba(15, 10, 31, 0.95) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ロゴ・タイトル（上から出現） */
  .opening-title {
    position: absolute;
    top: 22%;
    left: 0; right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
    animation: titleIn 1.2s 0.6s forwards;
  }
  @keyframes titleIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .opening-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4em;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 12px;
  }
  .opening-logo {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff4d8f, #a855f7, #06d6f8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 20px rgba(168, 85, 247, 0.4));
    line-height: 1.2;
    padding: 0 24px;
  }
  .opening-tagline {
    margin-top: 14px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 0.05em;
  }

  /* スタートボタン（下から出現、3秒遅延） */
  .opening-cta {
    position: absolute;
    bottom: 15%;
    left: 0; right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
    animation: ctaIn 0.8s 3s forwards;
  }
  @keyframes ctaIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .opening-start-btn {
    background: linear-gradient(135deg, #ff4d8f, #a855f7);
    color: #fff;
    border: none;
    padding: 16px 40px;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 30px rgba(255, 77, 143, 0.5);
    letter-spacing: 0.05em;
    animation: startPulse 2s ease-in-out infinite;
  }
  @keyframes startPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 8px 30px rgba(255, 77, 143, 0.5); }
    50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(255, 77, 143, 0.7); }
  }
  .opening-skip {
    display: block;
    margin-top: 14px;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
  }

  /* ========== ステージ2：ロール選択 ========== */
  .role-stage {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: linear-gradient(180deg, #0f0a1f, #1a0f3d);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
  }
  .role-stage.show {
    display: flex;
    animation: roleFadeIn 0.6s forwards;
  }
  @keyframes roleFadeIn { to { opacity: 1; } }

  .role-inner {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .role-title {
    font-size: 24px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff4d8f, #a855f7, #06d6f8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .role-sub {
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    margin-bottom: 28px;
  }
  .role-cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }
  .role-card {
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 20px 20px 18px;
    cursor: pointer;
    text-align: left;
    color: #fff;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .role-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 77, 143, 0.6);
    background: rgba(255, 77, 143, 0.10);
    box-shadow: 0 10px 40px rgba(255, 77, 143, 0.15);
  }
  .role-card.coach:hover {
    border-color: rgba(6, 214, 248, 0.6);
    background: rgba(6, 214, 248, 0.10);
    box-shadow: 0 10px 40px rgba(6, 214, 248, 0.15);
  }
  .role-emoji {
    font-size: 44px;
    flex-shrink: 0;
  }
  .role-info { flex: 1; min-width: 0; }
  .role-name { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
  .role-desc { font-size: 12px; color: rgba(255, 255, 255, 0.7); line-height: 1.6; }
  .role-arrow { color: rgba(255,255,255,0.5); font-size: 22px; }

  .role-skip {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
  }

  /* ========== ステージ3：ダミーのアプリホーム（デモ用） ========== */
  .app-stage {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: linear-gradient(180deg, #0f0a1f, #1a0f3d);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    color: #fff;
  }
  .app-stage.show { display: flex; }
  .app-stage h1 {
    font-size: 22px;
    background: linear-gradient(135deg, #ff4d8f, #06d6f8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  .app-stage p { color: rgba(255,255,255,0.7); margin-bottom: 20px; font-size: 14px; line-height: 1.7; }
  .app-reset-btn {
    background: rgba(255, 255, 255, 0.10);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 20px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- ステージ 1: オープニング（フラッシュバック） -->
<div class="opening-stage" id="openingStage">
  <div class="flashback">
    <!-- Cheernic の実際のトレ動画サムネを次々に -->
    <div class="flashback-slide" style="background-image: url(https://img.youtube.com/vi/zIRvDuuCYT4/maxresdefault.jpg), url(https://img.youtube.com/vi/zIRvDuuCYT4/hqdefault.jpg);"></div>
    <div class="flashback-slide" style="background-image: url(https://img.youtube.com/vi/KQkC4F17Eig/maxresdefault.jpg), url(https://img.youtube.com/vi/KQkC4F17Eig/hqdefault.jpg);"></div>
    <div class="flashback-slide" style="background-image: url(https://img.youtube.com/vi/j225kcq1rbM/maxresdefault.jpg), url(https://img.youtube.com/vi/j225kcq1rbM/hqdefault.jpg);"></div>
    <div class="flashback-slide" style="background-image: url(https://img.youtube.com/vi/HH5TBxl3sS4/maxresdefault.jpg), url(https://img.youtube.com/vi/HH5TBxl3sS4/hqdefault.jpg);"></div>
    <div class="flashback-slide" style="background-image: url(https://img.youtube.com/vi/EMdgRnHdy6s/maxresdefault.jpg), url(https://img.youtube.com/vi/EMdgRnHdy6s/hqdefault.jpg);"></div>
    <div class="flashback-slide" style="background-image: url(https://img.youtube.com/vi/C6FjY-jpCm0/maxresdefault.jpg), url(https://img.youtube.com/vi/C6FjY-jpCm0/hqdefault.jpg);"></div>
    <div class="flash-white"></div>
  </div>

  <div class="opening-title">
    <div class="opening-eyebrow">CHEER TUMBLING</div>
    <div class="opening-logo">タンブリング<br>ロードマップ</div>
    <div class="opening-tagline">正しいタンブリングを、安全に、段階的に</div>
  </div>

  <div class="opening-cta">
    <button class="opening-start-btn" onclick="goToRole()">ロードマップを始める →</button>
    <button class="opening-skip" onclick="goToRole()">スキップ</button>
  </div>
</div>

<!-- ステージ 2: ロール選択（初回のみ） -->
<div class="role-stage" id="roleStage">
  <div class="role-inner">
    <h1 class="role-title">はじめまして 👋</h1>
    <p class="role-sub">あなたはどちらでご利用ですか？</p>
    <div class="role-cards">
      <button class="role-card coach" onclick="chooseRole('coach')">
        <div class="role-emoji">👨‍🏫</div>
        <div class="role-info">
          <div class="role-name">コーチ・監督</div>
          <div class="role-desc">選手に課題を出したり、進捗管理をしたい</div>
        </div>
        <div class="role-arrow">→</div>
      </button>
      <button class="role-card" onclick="chooseRole('student')">
        <div class="role-emoji">🎓</div>
        <div class="role-info">
          <div class="role-name">選手・保護者</div>
          <div class="role-desc">自分やお子さまのタンブリング上達を目指す</div>
        </div>
        <div class="role-arrow">→</div>
      </button>
    </div>
    <button class="role-skip" onclick="chooseRole('skip')">あとで決める</button>
  </div>
</div>

<!-- ステージ 3: ダミーアプリ（デモ用） -->
<div class="app-stage" id="appStage">
  <div>
    <h1 id="appStageTitle">✨ ここから通常のアプリ画面へ</h1>
    <p id="appStageMsg">（本番では、ここでチアタンブリング ロードマップのホーム画面が表示されます）</p>
    <button class="app-reset-btn" onclick="reset()">🔄 最初から見直す</button>
  </div>
</div>

<script>
  const opening = document.getElementById('openingStage');
  const role = document.getElementById('roleStage');
  const app = document.getElementById('appStage');
  const appTitle = document.getElementById('appStageTitle');
  const appMsg = document.getElementById('appStageMsg');

  function goToRole() {
    opening.classList.add('done');
    setTimeout(() => role.classList.add('show'), 400);
  }
  function chooseRole(kind) {
    role.style.animation = 'none';
    role.style.opacity = '0';
    setTimeout(() => {
      role.style.display = 'none';
      app.classList.add('show');
      if (kind === 'coach') {
        appTitle.textContent = '✨ コーチ向け画面へ';
        appMsg.textContent = '（本番では、コーチダッシュボードや選手管理画面が開きます）';
      } else if (kind === 'student') {
        appTitle.textContent = '✨ 選手・保護者向け画面へ';
        appMsg.textContent = '（本番では、技一覧・練習メニュー・進捗記録などが開きます）';
      } else {
        appTitle.textContent = '✨ ホーム画面へ';
        appMsg.textContent = '（本番では、ロールを選ばずにそのままホームに進みます）';
      }
    }, 400);
  }
  function reset() {
    app.classList.remove('show');
    role.classList.remove('show');
    role.style.animation = '';
    role.style.opacity = '';
    role.style.display = '';
    opening.classList.remove('done');
  }

  // 自動遷移オプション：6秒後にオープニングを閉じる（現状は明示的なクリック待ち）
  // setTimeout(goToRole, 6000);
</script>

</body>
</html>
